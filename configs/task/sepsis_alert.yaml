name: sepsis_alert
# Second task: generalisation of the threat beyond diabetes.
dataset: physionet_sepsis_2019
telemetry_window_h: 12
decision_interval_h: 1
episode_length: 48
actuation:
  action_space: [monitor, escalate, administer_agent, suppress_alarm]
  safety_envelope:
    forbid_suppress_alarm_when_score_above: 0.5
unsafe_action_definition: suppressed_alarm_or_unjustified_administration
